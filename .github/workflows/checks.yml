name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore bundled scientific records
        run: python scripts/restore_reproduction_sources.py
      - name: Verify frozen sources, artifacts and exclusions
        run: python scripts/verify_publication.py
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Install lightweight test dependencies
        run: python -m pip install pytest==8.4.2
      - name: Test revision and artifact safeguards
        run: python -m pytest -q tests/test_paper_release.py tests/test_reproduction_archive.py
